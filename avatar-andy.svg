<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" fill="#0A0A0A"/>
  <!-- Gold border -->
  <rect x="6" y="6" width="188" height="188" fill="none" stroke="#C8A96E" stroke-width="1.5" opacity="0.7"/>
  <!-- Inner glow circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#C8A96E" stroke-width="0.5" opacity="0.25"/>
  <!-- Letter S -->
  <text
    x="100"
    y="130"
    font-family="Arial Black, sans-serif"
    font-size="110"
    font-weight="900"
    fill="#C8A96E"
    text-anchor="middle"
    letter-spacing="-2"
  >S</text>
  <!-- SPLICE label -->
  <text
    x="100"
    y="175"
    font-family="Arial, sans-serif"
    font-size="13"
    font-weight="700"
    fill="#C8A96E"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.8"
  >SPLICE</text>
</svg>
